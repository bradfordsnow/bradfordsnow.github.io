<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tuner</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tuner">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --green:  #3dff6e;
  --red:    #ff4040;
  --yellow: #ffd23f;
}

html, body {
  width:100%; height:100%;
  background:#000; color:#fff;
  font-family:'DM Sans',sans-serif;
  overflow:hidden; user-select:none;
}

.app {
  width:100%; max-width:420px; height:100dvh;
  margin:0 auto; display:flex; flex-direction:column;
  align-items:center; padding:0 32px;
  padding-top:env(safe-area-inset-top);
  /* no bottom padding here — handled by spacer div inside */
}

#singleView {
  width:100%; display:flex; flex-direction:column;
  align-items:center; flex:1; padding-top:12px;
}

.build-label {
  position:absolute; top:calc(env(safe-area-inset-top) + 6px); right:10px;
  font-size:9px; font-weight:400; letter-spacing:0.06em;
  color:rgba(255,255,255,0.12); pointer-events:none;
  font-family:'DM Sans',sans-serif;
}

/* ── Note ── */
.note-section {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
}
.note-big {
  font-size:172px; font-weight:700; line-height:0.88;
  letter-spacing:-6px; color:rgba(255,255,255,0.09);
  transition:color 0.12s; text-align:center; min-width:220px;
}
.note-big.active  { color:#fff; }
.note-big.in-tune { color:var(--green); }
.note-big.sharp   { color:var(--red); }
.note-big.flat    { color:var(--yellow); }
.note-big.playing { color:rgba(255,255,255,0.7); animation:pulse 0.6s ease-in-out infinite alternate; }
@keyframes pulse { from{opacity:0.6} to{opacity:1} }

.cents-line {
  font-size:20px; font-weight:400;
  color:rgba(255,255,255,0.51); margin-top:10px;
  height:28px; transition:color 0.3s;
}
.cents-line.in-tune { color:var(--green); }

/* ── Meter ── */
.meter-section { width:100%; margin-bottom:0; }

.meter-bar {
  width:100%; height:7px;
  background:rgba(255,255,255,0.07);
  border-radius:8px; position:relative; overflow:visible;
}
.meter-fill {
  position:absolute; top:0; bottom:0; border-radius:8px;
  width:0; left:50%; transition:background 0.12s; overflow:hidden;
}
.meter-tick {
  position:absolute; left:50%; top:50%;
  transform:translate(-50%,-50%);
  width:2px; height:19px; background:rgba(255,255,255,0.32);
  border-radius:1px; pointer-events:none; z-index:2;
}

/* ── Strobe ── */
.strobe-wrap {
  width:100%; height:12px; border-radius:8px;
  background:rgba(255,255,255,0.03);
  position:relative; overflow:hidden; margin-top:5px;
}
.strobe-wrap canvas {
  position:absolute; inset:0; width:100%; height:100%; display:block;
}
.strobe-tick {
  position:absolute; left:50%; top:0; bottom:0;
  width:1px; background:rgba(255,255,255,0.22); z-index:3;
}

.meter-labels {
  display:flex; justify-content:space-between;
  align-items:center; margin-top:10px;
}
.meter-side {
  font-size:11px; font-weight:500; letter-spacing:0.1em;
  color:rgba(255,255,255,0.27); transition:color 0.12s;
}
.meter-side.lit-flat  { color:var(--yellow); }
.meter-side.lit-sharp { color:var(--red); }
.meter-center-label {
  font-size:11px; font-weight:500; letter-spacing:0.14em;
  color:rgba(255,255,255,0.32); transition:color 0.3s;
}
.meter-center-label.in-tune { color:var(--green); }

/* ── Strings ── */
.strings-section { width:100%; margin-bottom:0; position:relative; margin-top:auto; padding-top:20px; }
.strings-viewport { width:100%; overflow:hidden; touch-action:pan-y; }
.strings-strip { display:flex; will-change:transform; }
.strings-row {
  display:grid; grid-template-columns:repeat(6,1fr);
  gap:4px; flex:0 0 100%; width:100%;
}

.str-btn {
  background:none; border:none; cursor:pointer;
  display:flex; flex-direction:column; align-items:center;
  gap:4px; padding:8px 0 6px; border-radius:12px;
  transition:background 0.15s;
}
.str-btn:active { background:rgba(255,255,255,0.05); }

.str-note {
  font-size:24px; font-weight:600;
  color:rgba(255,255,255,0.33); transition:color 0.15s; line-height:1;
}
.str-btn.active .str-note       { color:#fff; }
.str-btn.playing-tone .str-note { color:rgba(255,255,255,0.55); }
.str-note.capo-active           { color:var(--yellow); }

.str-index {
  font-size:10px; font-weight:400;
  color:rgba(255,255,255,0.21); letter-spacing:0.05em;
  transition:color 0.15s;
}
.str-btn.active .str-index { color:rgba(255,255,255,0.28); }

.str-pip {
  width:4px; height:4px; border-radius:50%;
  background:transparent; transition:background 0.15s;
}
.str-btn.active .str-pip { background:rgba(255,255,255,0.55); }

/* ── 12-string course buttons ── */
/* Course button: same grid slot, but shows two stacked sub-notes */
.course-btn {
  background:none; border:none; cursor:pointer;
  display:flex; flex-direction:column; align-items:center;
  gap:2px; padding:6px 0 5px; border-radius:12px;
  transition:background 0.15s; width:100%;
}
.course-btn:active { background:rgba(255,255,255,0.05); }

/* The note label inside a course button — single line e.g. "E/e" or "D" */
.course-sub {
  font-size:15px; font-weight:600; line-height:1;
  color:rgba(255,255,255,0.25); transition:color 0.15s;
  letter-spacing:-0.02em;
}
.course-btn.active .course-sub { color:rgba(255,255,255,0.45); }
.course-btn.active .course-sub.lit { color:#fff; }
.course-btn:not(.active) .course-sub { color:rgba(255,255,255,0.25); }

.course-idx {
  font-size:9px; font-weight:400; letter-spacing:0.05em;
  color:rgba(255,255,255,0.18); margin-top:2px;
}
.course-btn.active .course-idx { color:rgba(255,255,255,0.28); }

/* ── Bottom controls: Capo · Tuning · 440 all in one row ── */
.bottom-controls {
  width:100%;
  display:flex; justify-content:space-between; align-items:flex-start;
  margin-top:18px;
  padding-bottom:0;
  position:relative; z-index:20;
}

.corner-btn {
  font-size:11px; font-weight:500; letter-spacing:0.08em;
  color:rgba(255,255,255,0.39); cursor:pointer;
  padding:4px 0; text-transform:uppercase;
  transition:color 0.15s; white-space:nowrap;
  background:none; border:none;
  font-family:'DM Sans',sans-serif;
  min-width:60px;
}
.corner-btn#capoBtn { text-align:left; }
.corner-btn#a4Btn   { text-align:right; }
.corner-btn.active  { color:var(--yellow); }

/* All three popups rise upward from the bottom-controls row */
.bottom-popup {
  position:absolute; bottom:calc(100% + 6px);
  background:#000; border:1px solid rgba(255,255,255,0.08);
  border-radius:10px; padding:6px 0;
  opacity:0; pointer-events:none; transition:opacity 0.15s;
  z-index:30; overflow-y:auto; max-height:280px;
}
.bottom-popup.open { opacity:1; pointer-events:all; }
#capoDropdown    { left:0;   min-width:120px; }
#a4Dropdown      { right:0;  min-width:100px; }
#tuningDropdown  { left:50%; transform:translateX(-50%); min-width:160px; }

.popup-item {
  font-size:12px; font-weight:500;
  padding:7px 16px; cursor:pointer;
  transition:color 0.1s; white-space:nowrap; display:block;
}
.popup-item.align-left   { text-align:left; }
.popup-item.align-center { text-align:center; }
.popup-item.align-right  { text-align:right; }
.popup-item:hover { opacity:0.75; }

/* Tuning center label */
.tuning-center {
  flex:1; text-align:center; position:relative; cursor:pointer;
}
.tuning-line1 {
  font-size:12px; font-weight:500; letter-spacing:0.12em;
  color:rgba(255,255,255,0.57); text-transform:uppercase; display:block;
  transition:color 0.15s;
}
.tuning-line1.tuning-open { color:var(--yellow); }
.tuning-line2 {
  font-size:11px; font-weight:400; letter-spacing:0.14em;
  color:rgba(255,255,255,0.29); text-transform:uppercase; display:block;
}

/* ── All-strings view (code kept, hidden from nav) ── */
#allView { display:none; width:100%; flex:1; flex-direction:column; align-items:center; }
#allView.visible { display:flex; }

.all-header {
  margin-top:20px; font-size:12px; font-weight:500;
  letter-spacing:0.18em; color:rgba(255,255,255,0.2); text-transform:uppercase;
}
.all-chart {
  flex:1; width:100%; display:flex; flex-direction:column;
  justify-content:center; padding:0 4px; margin-top:-10px;
}
.chart-body { position:relative; width:100%; height:200px; }
.center-line {
  position:absolute; left:0; right:0; top:50%; height:1px;
  background:rgba(255,255,255,0.18); transform:translateY(-50%);
}
.tune-zone {
  position:absolute; left:0; right:0; top:calc(50% - 6px); height:12px;
  background:rgba(61,255,110,0.06);
  border-top:1px solid rgba(61,255,110,0.12);
  border-bottom:1px solid rgba(61,255,110,0.12);
}
.bars-row {
  position:absolute; inset:0; display:grid;
  grid-template-columns:repeat(6,1fr); gap:10px; padding:0 6px; align-items:center;
}
.bar-col { height:100%; display:flex; align-items:center; justify-content:center; position:relative; }
.str-bar {
  width:14px; border-radius:7px; position:absolute;
  left:50%; transform:translateX(-50%);
  transition:height 0.1s, top 0.1s, background 0.15s;
  background:rgba(255,255,255,0.1);
}
.all-string-labels {
  display:grid; grid-template-columns:repeat(6,1fr);
  gap:10px; padding:0 10px; margin-top:12px;
}
.all-str-label { text-align:center; }
.all-str-note {
  font-size:22px; font-weight:600;
  color:rgba(255,255,255,0.2); line-height:1; transition:color 0.15s;
}
.all-str-note.in-tune { color:var(--green); }
.all-str-note.sharp   { color:var(--red); }
.all-str-note.flat    { color:var(--yellow); }
.all-str-note.heard   { color:rgba(255,255,255,0.55); }
.all-str-cents {
  font-size:10px; font-weight:400; color:rgba(255,255,255,0.15);
  margin-top:3px; height:14px; transition:color 0.15s;
}
.all-str-cents.in-tune { color:var(--green); }
.exit-all-btn {
  margin-bottom:max(28px,env(safe-area-inset-bottom));
  background:none; border:1px solid rgba(255,255,255,0.12);
  border-radius:20px; padding:10px 24px;
  font-family:'DM Sans',sans-serif; font-size:12px; font-weight:500;
  letter-spacing:0.1em; color:rgba(255,255,255,0.3); cursor:pointer;
  transition:color 0.2s, border-color 0.2s;
}
</style>
</head>
<body>
<div class="app">
  <div class="build-label">Build 2.016</div>

  <!-- SINGLE VIEW -->
  <div id="singleView">

    <div class="note-section">
      <div class="note-big" id="noteBig">–</div>
      <div class="cents-line" id="centsLine"></div>
    </div>

    <div class="meter-section">
      <div class="meter-bar">
        <div class="meter-tick"></div>
        <div class="meter-fill" id="meterFill"></div>
      </div>
      <div class="strobe-wrap" id="strobeWrap">
        <canvas id="strobeCanvas"></canvas>
        <div class="strobe-tick"></div>
      </div>
      <div class="meter-labels">
        <span class="meter-side" id="lblFlat">Flat</span>
        <span class="meter-center-label" id="lblCenter">Listening</span>
        <span class="meter-side" id="lblSharp">Sharp</span>
      </div>
    </div>

    <div class="strings-section" id="stringsSection">
      <div class="strings-viewport" id="stringsViewport">
        <div class="strings-strip" id="stringsStrip"></div>
      </div>

      <!-- Unified bottom row: Capo · Standard Tuning · 440 -->
      <div class="bottom-controls" id="bottomControls">
        <button class="corner-btn" id="capoBtn">No Capo</button>
        <div class="tuning-center" id="tuningCenter">
          <span class="tuning-line1" id="tuningLine1">Standard</span>
          <span class="tuning-line2" id="tuningLine2">Tuning</span>
        </div>
        <button class="corner-btn" id="a4Btn">440</button>
        <!-- All three popups anchored inside bottom-controls -->
        <div class="bottom-popup" id="capoDropdown"></div>
        <div class="bottom-popup" id="tuningDropdown"></div>
        <div class="bottom-popup" id="a4Dropdown"></div>
      </div>

      <div style="height:max(20px,env(safe-area-inset-bottom))"></div>
    </div>

  </div>

  <!-- ALL STRINGS VIEW — code intact, not reachable via normal UI -->
  <div id="allView">
    <div class="all-header">All Strings</div>
    <div class="all-chart">
      <div class="chart-body">
        <div class="tune-zone"></div>
        <div class="center-line"></div>
        <div class="bars-row" id="barsRow"></div>
      </div>
      <div class="all-string-labels" id="allLabels"></div>
    </div>
    <button class="exit-all-btn" id="exitAllBtn">Back to tuner</button>
  </div>

</div>
<script>
/* ═══════════════════════════════
   TUNINGS
   "All Strings" kept in array for code compatibility but
   hidden from the tuning popup and swipe is blocked past Nashville.
═══════════════════════════════ */
const TUNINGS = [
  { key:'chromatic', line1:'Chromatic', chromatic:true, strings:[
    {note:'',freq:0,idx:'6'},{note:'',freq:0,idx:'5'},
    {note:'',freq:0,idx:'4'},{note:'',freq:0,idx:'3'},
    {note:'',freq:0,idx:'2'},{note:'',freq:0,idx:'1'}
  ]},
  { key:'standard', line1:'Standard', chromatic:false, strings:[
    {note:'E',freq:82.41,idx:'6'},{note:'A',freq:110.00,idx:'5'},
    {note:'D',freq:146.83,idx:'4'},{note:'G',freq:196.00,idx:'3'},
    {note:'B',freq:246.94,idx:'2'},{note:'e',freq:329.63,idx:'1'}
  ]},
  { key:'dropd', line1:'Drop D', chromatic:false, strings:[
    {note:'D',freq:73.42,idx:'6'},{note:'A',freq:110.00,idx:'5'},
    {note:'D',freq:146.83,idx:'4'},{note:'G',freq:196.00,idx:'3'},
    {note:'B',freq:246.94,idx:'2'},{note:'e',freq:329.63,idx:'1'}
  ]},
  { key:'dadgad', line1:'DADGAD', chromatic:false, strings:[
    {note:'D',freq:73.42,idx:'6'},{note:'A',freq:110.00,idx:'5'},
    {note:'D',freq:146.83,idx:'4'},{note:'G',freq:196.00,idx:'3'},
    {note:'A',freq:220.00,idx:'2'},{note:'D',freq:293.66,idx:'1'}
  ]},
  { key:'openg', line1:'Open G', chromatic:false, strings:[
    {note:'D',freq:73.42,idx:'6'},{note:'G',freq:98.00,idx:'5'},
    {note:'D',freq:146.83,idx:'4'},{note:'G',freq:196.00,idx:'3'},
    {note:'B',freq:246.94,idx:'2'},{note:'D',freq:293.66,idx:'1'}
  ]},
  { key:'opend', line1:'Open D', chromatic:false, strings:[
    {note:'D',freq:73.42,idx:'6'},{note:'A',freq:110.00,idx:'5'},
    {note:'D',freq:146.83,idx:'4'},{note:'F#',freq:185.00,idx:'3'},
    {note:'A',freq:220.00,idx:'2'},{note:'D',freq:293.66,idx:'1'}
  ]},
  // 12-string: 6 courses. Each course has two strings.
  // courses[i] = { label, strings:[{note,freq,sub},...] }
  // sub: 'low' or 'high' — used for display within a course.
  // Octave courses (E,A): low=standard pitch, high=octave up.
  // Unison courses (D,G,B,e): both strings same freq.
  // twelveString:true triggers dedicated UI and match logic.
  { key:'twelve', line1:'12 String', chromatic:false, twelveString:true,
    // For the strip we still need a flat strings[] for tone playback
    // and fallback. We store all 12 as a flat array, but group them
    // into courses via the courses[] structure used by buildStrip.
    courses:[
      { label:'E', strings:[
        {note:'E', freq:82.41,  sub:'low',  idx:'6'},
        {note:'e', freq:164.81, sub:'high', idx:'6\''}
      ]},
      { label:'A', strings:[
        {note:'A', freq:110.00, sub:'low',  idx:'5'},
        {note:'a', freq:220.00, sub:'high', idx:'5\''}
      ]},
      { label:'D', strings:[
        {note:'D', freq:146.83, sub:'low',  idx:'4'},
        {note:'D', freq:146.83, sub:'high', idx:'4\''}
      ]},
      { label:'G', strings:[
        {note:'G', freq:196.00, sub:'low',  idx:'3'},
        {note:'G', freq:196.00, sub:'high', idx:'3\''}
      ]},
      { label:'B', strings:[
        {note:'B', freq:246.94, sub:'low',  idx:'2'},
        {note:'B', freq:246.94, sub:'high', idx:'2\''}
      ]},
      { label:'e', strings:[
        {note:'e', freq:329.63, sub:'low',  idx:'1'},
        {note:'e', freq:329.63, sub:'high', idx:'1\''}
      ]},
    ],
    // Flat strings[] — 12 entries, courses interleaved low/high
    strings:[
      {note:'E', freq:82.41,  idx:'6' }, {note:'e', freq:164.81, idx:'6\''},
      {note:'A', freq:110.00, idx:'5' }, {note:'a', freq:220.00, idx:'5\''},
      {note:'D', freq:146.83, idx:'4' }, {note:'D', freq:146.83, idx:'4\''},
      {note:'G', freq:196.00, idx:'3' }, {note:'G', freq:196.00, idx:'3\''},
      {note:'B', freq:246.94, idx:'2' }, {note:'B', freq:246.94, idx:'2\''},
      {note:'e', freq:329.63, idx:'1' }, {note:'e', freq:329.63, idx:'1\''},
    ]
  },
  { key:'nashville', line1:'Nashville', chromatic:false, nonAscending:true, strings:[
    {note:'e',freq:164.81,idx:'6'},{note:'a',freq:220.00,idx:'5'},
    {note:'D',freq:293.66,idx:'4'},{note:'G',freq:392.00,idx:'3'},
    {note:'B',freq:246.94,idx:'2'},{note:'e',freq:329.63,idx:'1'}
  ]},
  // All Strings: kept for code compatibility, hidden from UI
  { key:'all', line1:'All Strings · Beta', hidden:true, chromatic:false, strings:[
    {note:'E',freq:82.41,idx:'6'},{note:'A',freq:110.00,idx:'5'},
    {note:'D',freq:146.83,idx:'4'},{note:'G',freq:196.00,idx:'3'},
    {note:'B',freq:246.94,idx:'2'},{note:'e',freq:329.63,idx:'1'}
  ]},
];

// Visible tunings = all except hidden ones
const VISIBLE_TUNINGS = TUNINGS.filter(t => !t.hidden);

const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTE_IDX   = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};

const CAPO_OPTIONS = [
  {val:-2,label:'−2  D'},{val:-1,label:'−1  Eb'},{val:0,label:'No Capo'},
  {val:1,label:'Fret 1'},{val:2,label:'Fret 2'},{val:3,label:'Fret 3'},
  {val:4,label:'Fret 4'},{val:5,label:'Fret 5'},{val:6,label:'Fret 6'},{val:7,label:'Fret 7'},
];
const A4_MIN = 430, A4_MAX = 450;

/* ═══════════════════════════════
   STATE
═══════════════════════════════ */
let curTuningIdx  = 1; // default Standard
let selStr        = 0;
let selSub        = 0; // 12-string: which sub-string within the selected course (0=low,1=high)
let isAllMode     = false;
let isPlayingTone = false;
let playToneTimer = null;
let activePicker  = null;
let capoIdx       = 2;
let a4Hz          = 440;
let tuningOpen    = false;

// String identification — independent of pitch display.
// selStrs is a Set of highlighted string indices (0–5).
// Empty = no confident match. Two entries = octave ambiguity (both highlighted).
let selStrs = new Set();

// chromatic fallback removed — string highlight always stays on

let audioCtx, analyser, srcNode, micStream, raf;
let toneCtx, toneOsc, toneGain;

let lastRMS=0, peakRMS=0, onsetTimer=null, onsetHoldOff=false;
const ONSET_MS=125, REL_GATE=0.05;

let centsHistory=[];
const HIST_N=4, AGREE_C=10;
let slowCents=0, slowNote='';

let barTargetLeft=50, barTargetWidth=0, barCurLeft=50, barCurWidth=0;
const BAR_DAMP=0.18;

// String-switch consensus: candidate must win this many consecutive frames
let switchCandidate=-1, switchVotes=0;
const SWITCH_FRAMES=5;

let inTuneHold=false, inTuneHoldT=null;

let strobeDrawOffset=0;
const STROBE_BAND_W=18, STROBE_GAP=18, STROBE_REPEAT=36;

let allState=Array(6).fill(null).map(()=>({cents:null,lastSeen:0}));
let recentStrings=new Set();

/* ═══════════════════════════════
   ELEMENTS
═══════════════════════════════ */
const singleView      = document.getElementById('singleView');
const allView         = document.getElementById('allView');
const tuningLine1     = document.getElementById('tuningLine1');
const tuningLine2     = document.getElementById('tuningLine2');
const tuningCenter    = document.getElementById('tuningCenter');
const bottomControls  = document.getElementById('bottomControls');
const tuningDropdown  = document.getElementById('tuningDropdown');
const capoBtn         = document.getElementById('capoBtn');

const capoDropdown    = document.getElementById('capoDropdown');

/* ═══════════════════════════════
   STROBE CANVAS
═══════════════════════════════ */
function sizeStrobeCanvas() {
  strobeCanvas.width  = strobeWrap.offsetWidth;
  strobeCanvas.height = strobeWrap.offsetHeight;
}
sizeStrobeCanvas();
window.addEventListener('resize', sizeStrobeCanvas);

function drawStrobe(cents) {
  const W=strobeCanvas.width, H=strobeCanvas.height;
  sCtx.clearRect(0,0,W,H);
  const absCents=Math.abs(cents);
  const HARD=3, FADE=5;

  if (absCents < HARD) {
    sCtx.fillStyle='rgba(61,255,110,0.72)';
    sCtx.fillRect(0,0,W,H);
    return;
  }

  const sharp=cents>0;
  const t=Math.min(1, absCents/50);
  const speed=(0.12 + 5.5*Math.pow(t, 2.2)) * 1.5;
  strobeDrawOffset += speed*(sharp ? 1 : -1);

  let r,g,b;
  if (absCents < 4)  { r=61;  g=255; b=110; }
  else if (sharp)    { r=255; g=64;  b=64;  }
  else               { r=255; g=210; b=63;  }

  const fadeRatio = absCents < FADE ? (absCents - HARD) / (FADE - HARD) : 1;
  const bandAlpha = (0.80 * fadeRatio).toFixed(3);

  let x=strobeDrawOffset;
  while (x > -STROBE_BAND_W) x -= STROBE_REPEAT;
  while (x < W) {
    sCtx.fillStyle=`rgba(${r},${g},${b},${bandAlpha})`;
    sCtx.fillRect(Math.round(x), 0, STROBE_BAND_W, H);
    x += STROBE_REPEAT;
  }

  if (absCents < FADE) {
    const greenAlpha=(0.72*(1 - fadeRatio)).toFixed(3);
    sCtx.fillStyle=`rgba(61,255,110,${greenAlpha})`;
    sCtx.fillRect(0,0,W,H);
  }

  const fw=Math.round(W*0.22);
  const lg=sCtx.createLinearGradient(0,0,fw,0);
  lg.addColorStop(0,'rgba(0,0,0,1)'); lg.addColorStop(0.55,'rgba(0,0,0,0.35)'); lg.addColorStop(1,'rgba(0,0,0,0)');
  sCtx.fillStyle=lg; sCtx.fillRect(0,0,fw,H);
  const rg=sCtx.createLinearGradient(W-fw,0,W,0);
  rg.addColorStop(0,'rgba(0,0,0,0)'); rg.addColorStop(0.45,'rgba(0,0,0,0.35)'); rg.addColorStop(1,'rgba(0,0,0,1)');
  sCtx.fillStyle=rg; sCtx.fillRect(W-fw,0,fw,H);
}

function clearStrobe() { sCtx.clearRect(0,0,strobeCanvas.width,strobeCanvas.height); }

/* ═══════════════════════════════
   CAPO / A4 UTILS
═══════════════════════════════ */
function capoSemitones() { return CAPO_OPTIONS[capoIdx].val; }

function transposeNote(name, semitones) {
  const base=name.replace(/\d/g,'');
  let idx=NOTE_IDX[base];
  if (idx===undefined) return name;
  idx=((idx+semitones)%12+12)%12;
  const n=NOTE_NAMES[idx];
  if (semitones<0){const f={'C#':'Db','D#':'Eb','F#':'Gb','G#':'Ab','A#':'Bb'};return f[n]||n;}
  return n;
}

function getStringNote(si) {
  const t = TUNINGS[curTuningIdx];
  if (t.twelveString) {
    const sub = t.courses[si].strings[selSub] || t.courses[si].strings[0];
    return {note: sub.note, transposed: false};
  }
  const base=t.strings[si].note;
  const s=capoSemitones();
  if (s===0) return {note:base, transposed:false};
  return {note:transposeNote(base,s), transposed:true};
}
function getStringFreq(si) {
  const t = TUNINGS[curTuningIdx];
  if (t.twelveString) {
    const sub = t.courses[si].strings[selSub] || t.courses[si].strings[0];
    return sub.freq; // already in Hz, a4 adjustment applied in adjustedFreq
  }
  const f=t.strings[si].freq;
  const s=capoSemitones();
  return s===0?f:f*Math.pow(2,s/12);
}
function adjustedFreq(f) { return f*(a4Hz/440); }

/* ── Chromatic utils ── */
function freqToMidi(f) { return Math.round(12*Math.log2(f/a4Hz)+69); }
function midiToFreq(m) { return a4Hz*Math.pow(2,(m-69)/12); }
function nearestNote(freq) {
  const midi=freqToMidi(freq);
  const name=NOTE_NAMES[((midi%12)+12)%12];
  const cents=1200*Math.log2(freq/midiToFreq(midi));
  return {name,cents};
}
function matchToString(freq) {
  const t = TUNINGS[curTuningIdx];
  const strings = t.strings;
  const curTarget = adjustedFreq(getStringFreq(selStr));

  // ── 12-string course mode ────────────────────────────────────────────────
  // Each course has a low and high string. When a course is selected:
  // - For octave courses (E,A): freely detect which of the two strings is
  //   sounding and update selSub accordingly. Octave block is OFF within
  //   the same course since the player deliberately plays one at a time.
  // - For unison courses (D,G,B,e): single target, just track cents.
  // Between courses: require detected pitch to be within 80¢ of a course
  // target AND more than 200¢ from current course before starting a vote.
  if (t.twelveString) {
    const curCourse = t.courses[selStr];
    const isUnison = curCourse.strings[0].freq === curCourse.strings[1].freq;

    // -- Within-course sub-string detection --
    // For octave courses, figure out which of the two strings is sounding
    if (!isUnison) {
      const lowFreq  = adjustedFreq(curCourse.strings[0].freq);
      const highFreq = adjustedFreq(curCourse.strings[1].freq);
      const dLow  = Math.abs(1200*Math.log2(freq/lowFreq));
      const dHigh = Math.abs(1200*Math.log2(freq/highFreq));
      // Only update selSub if confidently within 300¢ of one
      if (dLow < 300 || dHigh < 300) {
        const newSub = dHigh < dLow ? 1 : 0;
        if (newSub !== selSub) { selSub = newSub; buildStrip(); }
      }
    }

    // -- Between-course switching --
    // Very conservative: candidate must be within 80¢ and current must be > 200¢ away
    const distFromCur = curTarget > 0 ? Math.abs(1200*Math.log2(freq/curTarget)) : Infinity;

    let bestCourseIdx = selStr;
    let bestDist = distFromCur;

    t.courses.forEach((course, ci) => {
      if (ci === selStr) return;
      // Check both strings of each course
      course.strings.forEach(sub => {
        const target = adjustedFreq(sub.freq);
        const d = Math.abs(1200*Math.log2(freq/target));
        if (d < 80 && distFromCur > 200 && d < bestDist) {
          bestDist = d;
          bestCourseIdx = ci;
        }
      });
    });

    return { idx: bestCourseIdx, dist: bestDist };
  }

  // ── Nashville (non-ascending) mode ──────────────────────────────────────
  if (t.nonAscending) {
    let bestIdx = selStr;
    let bestDist = curTarget > 0
      ? Math.abs(1200 * Math.log2(freq / curTarget))
      : Infinity;

    strings.forEach((s, i) => {
      if (i === selStr) return;
      const target = adjustedFreq(getStringFreq(i));
      if (target === 0) return;
      const d = Math.abs(1200 * Math.log2(freq / target));
      if (d < 250 && d < bestDist && bestDist > 180) {
        bestDist = d;
        bestIdx = i;
      }
    });
    return { idx: bestIdx, dist: bestDist };
  }

  // ── Standard ascending mode ─────────────────────────────────────────────
  // Compute distance from detected freq to every string.
  // Then apply two protection rules before accepting a switch candidate:
  //
  // Rule 1 — Safe-zone lock: if the detected pitch is within half the
  // distance to the nearest *other* string, it unambiguously belongs to
  // the current string. Return immediately — no switch possible.
  // This handles detuned strings and harmonic misreads without needing
  // a fixed cents threshold that could break close-neighbour pairs (G/B).
  //
  // Rule 2 — Octave block: if a candidate is an octave away from the
  // current string AND the detected pitch is within 700¢, block it.

  // First pass: compute all distances
  const allDists = [];
  const t2 = TUNINGS[curTuningIdx];
  t2.strings.forEach((s, i) => {
    const target = adjustedFreq(getStringFreq(i));
    if (target === 0) { allDists.push(Infinity); return; }
    allDists.push(Math.abs(1200 * Math.log2(freq / target)));
  });

  const distFromCurrent = allDists[selStr] ?? Infinity;

  // Find the closest *other* string's distance
  let nearestOtherDist = Infinity;
  allDists.forEach((d, i) => { if (i !== selStr && d < nearestOtherDist) nearestOtherDist = d; });

  // Safe-zone: current string is closer than any other string,
  // AND the detected pitch is within 250¢ of it (sanity cap —
  // beyond 250¢ flat/sharp is genuinely a different string).
  if (distFromCurrent < nearestOtherDist && distFromCurrent < 250) {
    return { idx: selStr, dist: distFromCurrent };
  }

  // Second pass: find best candidate with octave block applied
  let bestIdx = 0, bestDist = Infinity;
  t2.strings.forEach((s, i) => {
    const target = adjustedFreq(getStringFreq(i));
    if (target === 0) return;
    let d = allDists[i];

    if (i !== selStr && curTarget > 0) {
      const octaveRatio = target / curTarget;
      const isOctaveAbove = Math.abs(octaveRatio - 2) < 0.10;
      const isOctaveBelow = Math.abs(octaveRatio - 0.5) < 0.06;
      if (isOctaveAbove || isOctaveBelow) {
        if (distFromCurrent < 700) { d = Infinity; }
      }
    }

    if (d < bestDist) { bestDist = d; bestIdx = i; }
  });
  return { idx: bestIdx, dist: bestDist };
}

/* ═══════════════════════════════
   BUILD STRIP
   Swipe is limited to VISIBLE_TUNINGS range so "All Strings"
   is unreachable via swipe. The strip still renders all rows
   for positional correctness but swipe cap prevents it.
═══════════════════════════════ */
const MAX_SWIPE_IDX = VISIBLE_TUNINGS.length - 1; // swipe ceiling

function buildStrip() {
  strip.innerHTML='';
  const isChromatic=TUNINGS[curTuningIdx].chromatic;
  const isTwelve=TUNINGS[curTuningIdx].twelveString;

  TUNINGS.forEach((t,ti)=>{
    const row=document.createElement('div');
    row.className='strings-row';

    if (ti===curTuningIdx && isChromatic) {
      row.style.minHeight='56px';

    } else if (ti===curTuningIdx && isTwelve) {
      // 12-string: render 6 course buttons, each showing "E/e" on one line
      t.courses.forEach((course, ci)=>{
        const isActive = selStrs.has(ci) || ci===selStr;
        const isPlaying = isActive&&isPlayingTone;
        const b=document.createElement('button');
        b.className='course-btn'+(isActive?' active':'')+(isPlaying?' playing-tone':'');

        const isUnison = course.strings[0].freq === course.strings[1].freq;
        // Single line: "E/e" for octave pairs, just "D" for unison
        const label = isUnison
          ? course.strings[0].note
          : `${course.strings[0].note}/${course.strings[1].note}`;

        b.innerHTML=`
          <div class="course-sub${isActive?' lit':''}">${label}</div>
          <div class="course-idx">${course.strings[0].idx}</div>`;

        b.addEventListener('click',()=>{
          if (ti!==curTuningIdx) return;
          closeAllDropdowns();
          if (isPlayingTone&&ci===selStr){clearTimeout(playToneTimer);isPlayingTone=false;stopTone();buildStrip();resetUI();return;}
          selStr=ci; selSub=0; selStrs=new Set([ci]);
          switchCandidate=-1; switchVotes=0;
          buildStrip(); triggerStringTone(ci);
        });
        row.appendChild(b);
      });

    } else {
      // Normal 6-string row
      const strings = t.twelveString ? t.courses.map(c=>c.strings[0]) : t.strings;
      strings.forEach((s, si)=>{
        const b=document.createElement('button');
        const isActive=ti===curTuningIdx&&selStrs.has(si);
        const isPlaying=isActive&&isPlayingTone;
        b.className='str-btn'+(isActive?' active':'')+(isPlaying?' playing-tone':'');
        const {note,transposed}=(ti===curTuningIdx)?getStringNote(si):{note:s.note,transposed:false};
        b.innerHTML=`<div class="str-pip"></div><div class="str-note${transposed?' capo-active':''}">${note}</div><div class="str-index">${s.idx}</div>`;
        b.addEventListener('click',()=>{
          if (ti!==curTuningIdx) return;
          closeAllDropdowns();
          if (isPlayingTone&&si===selStr){clearTimeout(playToneTimer);isPlayingTone=false;stopTone();buildStrip();resetUI();return;}
          selStr=si; selStrs=new Set([si]); buildStrip(); triggerStringTone(si);
        });
        row.appendChild(b);
      });
    }
    strip.appendChild(row);
  });

  strip.style.transition='none';
  strip.style.transform=`translateX(${-curTuningIdx*100}%)`;
  tuningLine1.textContent=TUNINGS[curTuningIdx].line1;
  tuningLine2.textContent='Tuning';
}

function updateStripPos(animate) {
  strip.style.transition=animate?'transform 0.35s cubic-bezier(0.32,0.72,0,1)':'none';
  strip.style.transform=`translateX(${-curTuningIdx*100}%)`;
}

function goToTuning(idx, animate=true) {
  const allIdx=TUNINGS.findIndex(t=>t.key==='all');
  curTuningIdx=Math.max(0, Math.min(TUNINGS.length-1, idx));
  selStr=0; selSub=0; selStrs=new Set();
  switchCandidate=-1; switchVotes=0; closeAllDropdowns();
  if (curTuningIdx===allIdx){buildStrip();resetUI();enterAllMode();}
  else {if(isAllMode)exitAllMode();buildStrip();resetUI();}
}

function updateCapoLabel() {
  const val=CAPO_OPTIONS[capoIdx].val;
  if (val===0){capoBtn.textContent='No Capo';capoBtn.classList.remove('active');}
  else if (val===-1){capoBtn.textContent='Eb';capoBtn.classList.add('active');}
  else if (val===-2){capoBtn.textContent='−2 D';capoBtn.classList.add('active');}
  else{capoBtn.textContent='Capo '+val;capoBtn.classList.add('active');}
}
function updateA4Label() {
  a4Btn.textContent=a4Hz===440?'440':a4Hz+' Hz';
  a4Hz!==440?a4Btn.classList.add('active'):a4Btn.classList.remove('active');
}

function buildCapoDropdown() {
  capoDropdown.innerHTML='';
  CAPO_OPTIONS.forEach((opt,i)=>{
    const el=document.createElement('div');
    el.className='popup-item align-left';
    el.style.color=(opt.val===0)?'#fff':(i===capoIdx?'#ffd23f':'rgba(255,255,255,0.25)');
    el.textContent=opt.label;
    el.addEventListener('click',e=>{e.stopPropagation();capoIdx=i;updateCapoLabel();buildStrip();closeAllDropdowns();});
    capoDropdown.appendChild(el);
  });
}
function buildA4DropdownList() {
  a4Dropdown.innerHTML='';
  for (let hz=A4_MIN;hz<=A4_MAX;hz++){
    const el=document.createElement('div');
    el.className='popup-item align-right';
    el.style.color=(hz===440)?'#fff':(hz===a4Hz?'#ffd23f':'rgba(255,255,255,0.25)');
    el.textContent=hz+' Hz';
    el.addEventListener('click',e=>{
      e.stopPropagation();a4Hz=hz;updateA4Label();
      Array.from(a4Dropdown.children).forEach((c,j)=>{
        const h=A4_MIN+j;c.style.color=h===440?'#fff':h===a4Hz?'#ffd23f':'rgba(255,255,255,0.25)';
      });
    });
    a4Dropdown.appendChild(el);
    if (hz===a4Hz) setTimeout(()=>el.scrollIntoView({block:'center',behavior:'instant'}),0);
  }
}
function buildTuningDropdown() {
  tuningDropdown.innerHTML='';
  VISIBLE_TUNINGS.forEach((t)=>{
    const realIdx=TUNINGS.indexOf(t);
    const el=document.createElement('div');
    el.className='popup-item align-center';
    const isDefault=(realIdx===1);
    const isSelected=(realIdx===curTuningIdx);
    el.style.color=isDefault?'#fff':(isSelected?'#ffd23f':'rgba(255,255,255,0.25)');
    el.textContent=t.line1;
    el.addEventListener('click',e=>{
      e.stopPropagation();
      goToTuning(realIdx);
      closeAllDropdowns();
    });
    tuningDropdown.appendChild(el);
  });
}

function openTuningDropdown() {
  buildTuningDropdown();
  tuningDropdown.classList.add('open');
  tuningLine1.classList.add('tuning-open');
  tuningOpen=true;
}
function closeTuningDropdown() {
  tuningDropdown.classList.remove('open');
  tuningLine1.classList.remove('tuning-open');
  tuningOpen=false;
}
function closeAllDropdowns() {
  activePicker=null;
  capoDropdown.classList.remove('open');
  a4Dropdown.classList.remove('open');
  closeTuningDropdown();
}

capoBtn.addEventListener('click',e=>{
  e.stopPropagation();
  const isOpen=capoDropdown.classList.contains('open');
  closeAllDropdowns();
  if (!isOpen){buildCapoDropdown();capoDropdown.classList.add('open');activePicker='capo';}
});
a4Btn.addEventListener('click',e=>{
  e.stopPropagation();
  const isOpen=a4Dropdown.classList.contains('open');

tuningCenter.addEventListener('click',e=>{

document.addEventListener('click',()=>closeAllDropdowns());
document.addEventListener('touchstart',e=>{

},{passive:true});

/* ═══════════════════════════════
   SWIPE — capped at MAX_SWIPE_IDX so All Strings unreachable
═══════════════════════════════ */
let tSX=0, tSY=0, dragging=false, dragDx=0;
function swipeStart(e){tSX=e.touches[0].clientX;tSY=e.touches[0].clientY;dragging=false;dragDx=0;strip.style.transition='none';}
function swipeMove(e){
  const dx=e.touches[0].clientX-tSX,dy=e.touches[0].clientY-tSY;
  if (!dragging&&Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>6){dragging=true;closeAllDropdowns();}
  if (!dragging) return;
  dragDx=dx;
  strip.style.transform=`translateX(calc(${-curTuningIdx*100}% + ${dragDx}px))`;
}
function swipeEnd(){
  if (!dragging) return;
  const thresh=viewport.offsetWidth*0.22;
  // Cap right swipe at MAX_SWIPE_IDX so All Strings is unreachable
  if (dragDx<-thresh&&curTuningIdx<MAX_SWIPE_IDX)      goToTuning(curTuningIdx+1);
  else if (dragDx>thresh&&curTuningIdx>0)               goToTuning(curTuningIdx-1);
  else updateStripPos(true);
  dragging=false;dragDx=0;
}
[viewport,strSection].forEach(el=>{
  el.addEventListener('touchstart',swipeStart,{passive:true});
  el.addEventListener('touchmove',swipeMove,{passive:true});
  el.addEventListener('touchend',swipeEnd);
});

    col.appendChild(bar);barsRow.appendChild(col);

    allLabels.appendChild(lbl);
  });
}
function updateAllBar(si,cents) {
  const bar=document.getElementById('bar-'+si);
  const noteEl=document.getElementById('aln-'+si);
  const cEl=document.getElementById('alc-'+si);
  if (!bar) return;
  const chartH=document.querySelector('.chart-body').offsetHeight;
  const half=chartH/2;
  const inTune=Math.abs(cents)<4,sharp=cents>4;
  const clamp=Math.max(-50,Math.min(50,cents));
  const barH=Math.max(4,Math.abs(clamp/50)*(half*0.82));
  bar.style.height=barH+'px';
  bar.style.background=inTune?'var(--green)':sharp?'var(--red)':'var(--yellow)';
  bar.style.top=clamp>=0?(half-barH)+'px':half+'px';
  noteEl.className='all-str-note'+(inTune?' in-tune':sharp?' sharp':' flat heard');
  cEl.textContent=(cents>=0?'+':'')+cents.toFixed(0)+'¢';
  cEl.className='all-str-cents'+(inTune?' in-tune':'');
}
function enterAllMode(){
  isAllMode=true;singleView.style.display='none';allView.classList.add('visible');
  allState=Array(6).fill(null).map(()=>({cents:null,lastSeen:0}));buildAllView();
}
function exitAllMode(){
  isAllMode=false;allView.classList.remove('visible');singleView.style.display='';
  recentStrings.clear();curTuningIdx=1;buildStrip();resetUI();
}
exitAllBtn.addEventListener('click',exitAllMode);

/* ═══════════════════════════════
   YIN PITCH DETECTION
═══════════════════════════════ */
function yin(buf,sr) {
  const SIZE=buf.length,HALF=Math.floor(SIZE/2),THRESH=0.20;
  let rms=0;
  for (let i=0;i<SIZE;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/SIZE);
  peakRMS=Math.max(peakRMS*0.995,rms);
  if (peakRMS<0.003||rms<peakRMS*REL_GATE) return null;
  const isOnset=rms>lastRMS*1.5&&rms>0.01;
  lastRMS=rms;
  if (isOnset){onsetHoldOff=true;clearTimeout(onsetTimer);onsetTimer=setTimeout(()=>{onsetHoldOff=false;},ONSET_MS);return null;}
  if (onsetHoldOff) return null;
  const diff=new Float32Array(HALF);
  for (let tau=1;tau<HALF;tau++){for(let i=0;i<HALF;i++){const d=buf[i]-buf[i+tau];diff[tau]+=d*d;}}
  const cmnd=new Float32Array(HALF);cmnd[0]=1;
  let runSum=0;
  for (let tau=1;tau<HALF;tau++){runSum+=diff[tau];cmnd[tau]=runSum===0?0:diff[tau]*tau/runSum;}
  const minTau=Math.floor(sr/1400),maxTau=Math.min(HALF-1,Math.floor(sr/55));
  let tau=minTau;
  while (tau<maxTau){
    if (cmnd[tau]<THRESH){
      while(tau+1<maxTau&&cmnd[tau+1]<cmnd[tau])tau++;
      const better=tau>0&&tau<HALF-1?tau+(cmnd[tau+1]-cmnd[tau-1])/(2*(2*cmnd[tau]-cmnd[tau-1]-cmnd[tau+1])):tau;
      return {freq:sr/better};
    }
    tau++;
  }
  let minVal=Infinity,minIdx=-1;
  for (let t=minTau;t<maxTau;t++){if(cmnd[t]<minVal){minVal=cmnd[t];minIdx=t;}}
  if (minIdx>0&&minVal<0.5) return {freq:sr/minIdx};
  return null;
}

/* ═══════════════════════════════
   MIC
═══════════════════════════════ */
async function startMic() {
  try {
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}});
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=8192; analyser.smoothingTimeConstant=0.5;
    srcNode=audioCtx.createMediaStreamSource(micStream);
    srcNode.connect(analyser);
    lblCenter.textContent='Listening';
    loop();
  } catch(e){lblCenter.textContent='No mic';}
}

/* ═══════════════════════════════
   STRING IDENTIFICATION
   Completely independent of pitch display.
   Returns a Set of string indices that are plausible matches for freq.

   Rules:
   1. A string is a candidate if the detected freq is within CONF_CENTS
      of its target (tight — must be genuinely close).
   2. If two candidates are the same note letter but different octaves,
      return both (let the UI highlight both rather than guess wrong).
   3. If no candidate is within CONF_CENTS, return empty set.
   4. Never uses selStr or any pitch display state.
═══════════════════════════════ */
const CONF_CENTS = 150; // ¢ — must be within this to claim a string

function identifyString(freq) {
  const t = TUNINGS[curTuningIdx];
  if (t.chromatic || t.twelveString) return new Set(); // handled separately

  const candidates = [];
  t.strings.forEach((s, i) => {
    const target = adjustedFreq(getStringFreq(i));
    if (target === 0) return;
    const d = Math.abs(1200 * Math.log2(freq / target));
    if (d < CONF_CENTS) candidates.push({i, d, target, note: s.note.toUpperCase().replace(/[^A-G#]/g,'')});
  });

  if (candidates.length === 0) return new Set();
  if (candidates.length === 1) return new Set([candidates[0].i]);

  // Multiple candidates — check for octave relationships
  // Sort by distance so closest is first
  candidates.sort((a,b) => a.d - b.d);

  // If top two are same note letter and octave-related, return both
  const best = candidates[0];
  const octaveMatches = candidates.filter(c => {
    if (c.i === best.i) return true;
    const sameNote = c.note === best.note;
    const ratio = c.target / best.target;
    const isOctave = Math.abs(ratio-2)<0.15 || Math.abs(ratio-0.5)<0.08;
    return sameNote && isOctave;
  });

  if (octaveMatches.length > 1) {
    // Ambiguous octave — return both so UI can highlight both
    return new Set(octaveMatches.map(c=>c.i));
  }

  // Single clear winner
  return new Set([best.i]);
}

/* ═══════════════════════════════
   DETECT LOOP
═══════════════════════════════ */
let silF=0,idleT;
function loop() {
  const buf=new Float32Array(analyser.fftSize);
  function tick() {
    if (!audioCtx) return;
    raf=requestAnimationFrame(tick);
    if (audioCtx.state === 'suspended') audioCtx.resume();
    analyser.getFloatTimeDomainData(buf);

    if (isPlayingTone) { animateBar(); return; }
    const result=yin(buf,audioCtx.sampleRate);
    if (result&&result.freq>55&&result.freq<1500) {
      silF=0; clearTimeout(idleT);
      const freq = result.freq;
      const nn=nearestNote(freq);
      if (isAllMode) {
        const {idx,dist}=matchToString(freq);
        if (dist<60){const cents=1200*Math.log2(freq/adjustedFreq(getStringFreq(idx)));updateAllBar(idx,cents);}
      } else {

        // ── PITCH DISPLAY: pure chromatic, never affected by string ID ──
        const displayNote  = nn.name.toUpperCase();
        const displayCents = nn.cents;

        centsHistory.push(displayCents);
        if (centsHistory.length>HIST_N) centsHistory.shift();
        if (centsHistory.length>=HIST_N){
          const mn=Math.min(...centsHistory),mx=Math.max(...centsHistory);
          if (mx-mn<AGREE_C){slowCents=centsHistory.reduce((a,b)=>a+b)/HIST_N;slowNote=displayNote;}
        }
        updateBarFast(displayCents);
        if (slowNote) updateSlowDisplay(slowNote, slowCents);
        drawStrobe(displayCents);

        // ── STRING IDENTIFICATION: independent, conservative ──
        const isChromatic = TUNINGS[curTuningIdx].chromatic;
        if (!isChromatic && !TUNINGS[curTuningIdx].twelveString) {
          const candidates = identifyString(freq);
          const candKey = [...candidates].sort().join(',');

          if (candKey === switchCandidate) {
            switchVotes++;
            if (switchVotes >= SWITCH_FRAMES) {
              selStrs = candidates;
              if (candidates.size > 0) selStr = [...candidates][0];
              buildStrip();
            }
          } else {
            switchCandidate = candKey;
            switchVotes = 1;
          }
        }
      }
    } else {
      silF++;
      if (silF===25){
        centsHistory=[]; switchCandidate=-1; switchVotes=0;
        clearTimeout(idleT);
        idleT=setTimeout(()=>{
          if (!isAllMode&&!isPlayingTone){
            slowCents=0; slowNote=''; selStr=0; selSub=0;
            selStrs=new Set(); resetUI(); buildStrip();
          }
        }, 2000);
      }
      if (!isPlayingTone) clearStrobe();
    }
    animateBar();
  }
  tick();
}

/* ═══════════════════════════════
   UI
═══════════════════════════════ */
function updateBarFast(cents) {
  const inTune=Math.abs(cents)<4, sharp=cents>4;
  const half=meterFill.parentElement.offsetWidth/2;
  const clamp=Math.max(-50,Math.min(50,cents));
  const fillW=Math.abs(clamp/50)*(half-4);
  barTargetLeft=clamp<0?(half-fillW):half;
  barTargetWidth=fillW;
  if (inTune&&!inTuneHold){inTuneHold=true;clearTimeout(inTuneHoldT);inTuneHoldT=setTimeout(()=>{inTuneHold=false;},500);}
  const color=(inTune||inTuneHold)?'var(--green)':sharp?'var(--red)':'var(--yellow)';
  meterFill.style.background=color;
  lblFlat.className='meter-side'+(!inTune&&!sharp&&!inTuneHold?' lit-flat':'');
  lblSharp.className='meter-side'+(!inTune&&sharp&&!inTuneHold?' lit-sharp':'');
}
function animateBar() {
  barCurLeft+=(barTargetLeft-barCurLeft)*BAR_DAMP;
  barCurWidth+=(barTargetWidth-barCurWidth)*BAR_DAMP;
  meterFill.style.left=barCurLeft+'px';
  meterFill.style.width=barCurWidth+'px';
}
function updateSlowDisplay(note, cents) {
  const inTune=Math.abs(cents)<4||inTuneHold, sharp=cents>4;
  noteBig.textContent=note;
  noteBig.className='note-big'+(inTune?' in-tune':sharp?' sharp':note?' flat':'');
  if (note){
    centsLine.textContent=(cents>=0?'+':'')+cents.toFixed(1)+'¢';
    centsLine.className='cents-line'+(inTune?' in-tune':'');
  }
  lblCenter.style.color='';
  lblCenter.textContent=inTune?'In tune':'';
  lblCenter.className='meter-center-label'+(inTune?' in-tune':'');
}
function resetUI() {
  noteBig.className='note-big';noteBig.textContent='–';
  centsLine.textContent='';centsLine.className='cents-line';
  barTargetLeft=50;barTargetWidth=0;barCurLeft=50;barCurWidth=0;
  meterFill.style.left='50%';meterFill.style.width='0';meterFill.style.background='transparent';
  lblFlat.className='meter-side';lblSharp.className='meter-side';
  lblCenter.textContent='Listening';lblCenter.className='meter-center-label';
  lblCenter.style.color='';
  inTuneHold=false;clearTimeout(inTuneHoldT);clearStrobe();
}

/* ═══════════════════════════════
   TONE
   [1] Volume doubled: gain 1.0 (was 0.68).
       Added 3rd harmonic for guitar-like warmth.
       Slightly softened attack (40ms) to avoid click at higher gain.
═══════════════════════════════ */
function triggerStringTone(si) {
  clearTimeout(playToneTimer);
  isPlayingTone=true;buildStrip();
  const freq=adjustedFreq(getStringFreq(si));
  const {note}=getStringNote(si);
  noteBig.textContent=note;noteBig.className='note-big playing';
  centsLine.textContent=freq.toFixed(1)+' Hz';centsLine.className='cents-line';
  barTargetWidth=0;meterFill.style.background='transparent';
  lblCenter.textContent='Playing';lblCenter.className='meter-center-label';
  lblFlat.className='meter-side';lblSharp.className='meter-side';
  clearStrobe();fadeOutAndPlay(freq);
  playToneTimer=setTimeout(()=>{
    isPlayingTone=false; stopTone(); buildStrip(); resetUI();
    // Resume mic context in case iOS suspended it during tone playback
    if (audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  }, 7200);
}
function fadeOutAndPlay(freq) {
  if (toneGain&&toneCtx){
    const t=toneCtx.currentTime;
    toneGain.gain.cancelScheduledValues(t);
    toneGain.gain.setValueAtTime(toneGain.gain.value,t);
    toneGain.gain.linearRampToValueAtTime(0,t+0.08);
    const old=toneCtx;setTimeout(()=>old.close().catch(()=>{}),100);
    toneCtx=null;toneOsc=null;toneGain=null;
  }
  playTone(freq);
}
function playTone(freq) {
  toneCtx=new (window.AudioContext||window.webkitAudioContext)();

  const o1=toneCtx.createOscillator(); // fundamental — triangle for warmth
  const o2=toneCtx.createOscillator(); // 2nd harmonic
  const o3=toneCtx.createOscillator(); // 3rd harmonic — adds body

  const g =toneCtx.createGain(); // master
  const g2=toneCtx.createGain(); // 2nd level
  const g3=toneCtx.createGain(); // 3rd level

  o1.type='triangle'; o1.frequency.value=freq;
  o2.type='sine';     o2.frequency.value=freq*2;
  o3.type='sine';     o3.frequency.value=freq*3;

  g2.gain.value=0.18;
  g3.gain.value=0.08;

  o1.connect(g);
  o2.connect(g2); g2.connect(g);
  o3.connect(g3); g3.connect(g);
  g.connect(toneCtx.destination);

  const t=toneCtx.currentTime;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(1.0,t+0.04); // [1] peak 1.0, was 0.68
  g.gain.setValueAtTime(1.0,t+6.5);
  g.gain.exponentialRampToValueAtTime(0.001,t+7);

  o1.start(t);o2.start(t);o3.start(t);
  o1.stop(t+7.1);o2.stop(t+7.1);o3.stop(t+7.1);
  toneOsc=o1;toneGain=g;
}
function stopTone() {
  if (toneGain&&toneCtx){
    const t=toneCtx.currentTime;
    toneGain.gain.cancelScheduledValues(t);
    toneGain.gain.setValueAtTime(toneGain.gain.value,t);
    toneGain.gain.linearRampToValueAtTime(0,t+0.08);
    const old=toneCtx;setTimeout(()=>old.close().catch(()=>{}),100);
  }
  toneCtx=null;toneOsc=null;toneGain=null;
}

/* ═══════════════════════════════
   INIT
═══════════════════════════════ */
buildStrip();
updateCapoLabel();
updateA4Label();

// Start mic immediately — on HTTPS (Netlify) iOS allows getUserMedia
// without a prior gesture. The system permission prompt handles consent.
// We do NOT wait for first touch, because waiting means the mic isn't
// ready until after the first interaction, causing the delay.
startMic();

// Fallback: if startMic failed (e.g. page loaded without HTTPS locally),
// retry on first touch. Remove listener once mic is running.
document.addEventListener('touchstart', function onFirst() {
  if (audioCtx) { document.removeEventListener('touchstart', onFirst); return; }
  startMic();
  document.removeEventListener('touchstart', onFirst);
}, {passive: true});
</script>
